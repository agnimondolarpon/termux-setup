# ~/.termux/termux.properties
# Apply changes with: termux-reload-settings

# Extra keys: Termux default layout (uncomment extra-keys below to customise).
# extra-keys-style = default
# extra-keys = [['ESC','{','}','&','*','|','UP','PGUP'],['TAB','CTRL','ALT',';','LEFT','DOWN','RIGHT','PGDN']]

# Hardware/Android Back key sends Escape (handy in Neovim).
back-key = escape

# No bell sound/vibration.
bell-character = ignore

# Keep more scrollback.
terminal-transcript-rows = 10000

# Cursor: block | bar | underline (0 = no blinking).
terminal-cursor-style = block
terminal-cursor-blink-rate = 0

# Volume keys act as Ctrl / Fn-style virtual keys.
volume-keys = virtual
